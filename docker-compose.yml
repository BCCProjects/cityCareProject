version: "3.9"

services:
  # db:
  #   image: mysql:8.4
  #   command: --default-authentication-plugin=mysql_native_password
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_DATABASE: ${MYSQL_DATABASE:-city_care}
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-changeme}
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
  #     MYSQL_USER: ${MYSQL_USER:-root}
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - city_care/.env
    environment:
      MYSQL_HOST: host.docker.internal
    volumes:
      - ./city_care:/app
    ports:
      - "8000:8000"
    # depends_on:
    #   - db

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    env_file:
      - city_app/.env
    environment:
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://backend:8000/api}
    volumes:
      - ./city_app:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
      - "19000:19000"
    depends_on:
      - backend

volumes:
  mysql_data:
  frontend_node_modules:
